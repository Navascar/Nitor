[package]
name = "nitor"
description = "Nitor — керування RGB-прожекторами через DMX"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nitor-core.workspace = true
nitor-ui.workspace = true
serde_json.workspace = true
indexmap.workspace = true
log.workspace = true
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "x11", "wayland"] }
egui_extras = { version = "0.32.3", features = ["svg", "image"] }
rfd = "0.17.2"
image = { version = "0.25.9", default-features = false, features = ["png", "ico"] }
egui = "0.32.3"
arboard = "3.7.0"
ureq = "2"
# пульт з телефона: сесії (uuid) і QR-код адреси
uuid.workspace = true
qrcodegen = "1.8"
# VirtualDJ знаходить сервер OS2L через mDNS (DNS-SD)
mdns-sd = "0.22"

[target."cfg(windows)".dependencies]
# звук (WASAPI, зокрема звук самого комп'ютера) і MIDI — лише Windows; на Linux ці крейти тягнуть C-бібліотеку ALSA
wasapi = "0.27"
midir = "0.11"
# автозапуск (реєстр) — лише Windows
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Console", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
