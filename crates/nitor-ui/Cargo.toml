[package]
name = "nitor-ui"
description = "Дизайн-система Nitor для egui: токени, шрифти, кнопки, повзунки, іконки"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egui = "0.32.3"
# той самий розбирач шрифтів, що в egui: перевірка системного шрифту перед використанням
ab_glyph = "0.2.32"
# вибір рушія малювання вікна (render.rs): DirectX 12 / Vulkan, запасний — GL (у т.ч. програмний)
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "glow"] }
wgpu = { version = "25.0.2", default-features = false, features = ["dx12", "vulkan", "gles", "metal", "wgsl"] }
log.workspace = true
