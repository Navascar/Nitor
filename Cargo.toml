[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.3.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/Navascar/Nitor"
rust-version = "1.85"

[workspace.dependencies]
nitor-core = { path = "crates/nitor-core" }
nitor-ui = { path = "crates/nitor-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
